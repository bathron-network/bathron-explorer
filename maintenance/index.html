<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATHRON Explorer</title>
<style>
:root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1c1c1a; --muted: #5c5c57; --line: #d9d9d4; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9aa4ae; --line: #30363d; } }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; }
h1 { font-size: 1.1rem; letter-spacing: .08em; margin: 0 0 1.2rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line); }
p { margin: 0 0 1rem; }
a { color: inherit; text-underline-offset: 3px; }
.muted { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>BATHRON EXPLORER</h1>
<p>The DMM public testnet was shut down on 5 October 2026. A new network using consensus engine N is under construction. No launch date has been announced.</p>
<p class="muted"><a href="https://bathron.org/docs/status.html">Network status</a></p>
</main>
</body>
</html>
